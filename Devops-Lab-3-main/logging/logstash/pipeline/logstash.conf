input {
  beats { port => 5044 }
}

filter {
  if [container][name] =~ /demo-app/ {
    json { source => "message" target => "app_event" }
    date { match => ["[app_event][timestamp]", "ISO8601"] target => "@timestamp" }
    mutate { add_field => { "pipeline" => "lab3-centralized-logging" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "lab3-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
